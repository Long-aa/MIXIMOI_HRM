version: '3.8'

services:
  # CSDL PostgreSQL 15 chuẩn hoá
  db:
    image: postgres:15-alpine
    container_name: miximoi_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: miximoi_hrm
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password_2026
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/sample-data.sql:/docker-entrypoint-initdb.d/02_sample.sql:ro
      - ./database/recruitment_schema.sql:/docker-entrypoint-initdb.d/03_recruitment.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d miximoi_hrm"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Ứng dụng Web Java Tomcat 10
  app:
    build:
      context: ./MIXIMOI_HRM
      dockerfile: Dockerfile
    container_name: miximoi_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://db:5432/miximoi_hrm
      DB_USER: postgres
      DB_PASSWORD: postgres_password_2026
      # Cấu hình SMTP Email Server (có thể đổi sang Gmail / SendGrid / Mailtrap)
      SMTP_HOST: smtp.gmail.com
      SMTP_PORT: "587"
      SMTP_USER: notification@miximoi.vn
      SMTP_PASSWORD: your_app_password
      SMTP_FROM_NAME: "MIXIMOI HRM Portal"

volumes:
  pgdata:
    driver: local
